<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>登录 · sing-box 流量面板</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login">
  <form method="get" action="/">
    <h1>sing-box 流量面板</h1>
    <p>请输入访问令牌（安装时生成，可用 <code>sbx</code> 菜单查看）</p>
    <input type="password" name="token" placeholder="访问令牌" autocomplete="current-password"
           autofocus required aria-label="访问令牌">
    <button type="submit">进入面板</button>
  </form>
</div>
</body>
</html>
