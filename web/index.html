<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sing-box 流量面板</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-txt">
      <h1>sing-box 流量面板</h1>
    </div>
  </div>
</header>

<main>
  <div id="view-home" class="app-view on">
  <!-- 实时速率主卡 -->
  <section class="hero">
    <div class="hero-live">
      <div class="hero-head">
        <span class="hero-label">实时速率</span>
        <span class="hero-pulse" id="pulse"></span>
      </div>
      <div class="hero-rate" id="hero-rate">—</div>
      <div class="hero-split">
        <span class="up">↑ 上传 <b id="hero-up">—</b></span>
        <span class="down">↓ 下载 <b id="hero-down">—</b></span>
      </div>
    </div>
    <div class="hero-stats">
      <div class="mini">
        <span class="mini-label">TCP 连接</span>
        <span class="mini-value" id="kpi-conns">—</span>
      </div>
      <div class="mini">
        <span class="mini-label">UDP 会话</span>
        <span class="mini-value" id="kpi-conns-udp">—</span>
      </div>
      <div class="mini">
        <span class="mini-label">今日流量</span>
        <span class="mini-value" id="kpi-today-total">—</span>
        <span class="mini-sub"><i class="up" id="kpi-today-up">—</i> <i class="down" id="kpi-today-down">—</i></span>
      </div>
      <div class="mini">
        <span class="mini-label">累计流量 · <span id="kpi-nodes">—</span> 节点</span>
        <span class="mini-value" id="kpi-all-total">—</span>
        <span class="mini-sub"><i class="up" id="kpi-all-up">—</i> <i class="down" id="kpi-all-down">—</i></span>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>节点状态</h2>
    </div>
    <div class="table-wrap">
      <table id="node-table">
        <thead>
          <tr>
            <th>节点</th><th>类型</th><th>端口</th>
            <th class="num" title="ESTABLISHED 状态的 TCP 连接数">TCP</th>
            <th class="num" title="有对端的 UDP 会话 socket 数">UDP</th>
            <th class="num">实时速率</th>
          </tr>
        </thead>
        <tbody id="node-tbody"></tbody>
      </table>
    </div>
    <div id="node-cards" class="node-cards"></div>
  </section>

  </div>

  <div id="view-daily" class="app-view">
  <section class="panel data-panel">
    <div class="panel-head">
      <h2>每日流量</h2>
    </div>
    <div id="daily-table" class="excel-wrap"></div>
  </section>

  </div>

  <div id="view-node" class="app-view">
  <section class="panel data-panel">
    <div class="panel-head">
      <h2>单节点每日明细</h2>
      <select id="node-select" aria-label="选择节点"></select>
    </div>
    <div id="node-daily-table" class="excel-wrap"></div>
  </section>
  </div>

  <div id="view-manage" class="app-view">
    <section class="panel manage-panel">
      <div class="panel-head"><h2>节点管理</h2></div>
      <div id="manage-lock" class="manage-lock">
        <label for="manage-key">管理密钥</label>
        <input id="manage-key" type="password" autocomplete="off" placeholder="输入管理密钥">
        <button id="manage-unlock" type="button">解锁管理</button>
        <p id="manage-msg"></p>
      </div>
      <div id="manage-content" hidden>
        <label for="manage-node">选择节点</label>
        <select id="manage-node"></select>
        <label for="manage-port">端口</label>
        <input id="manage-port" inputmode="numeric" type="number" min="1" max="65535">
        <div id="manage-sni-box">
          <label for="manage-sni">SNI</label>
          <input id="manage-sni" type="text" autocomplete="off">
        </div>
        <div class="manage-actions">
          <button id="manage-save" type="button">保存修改</button>
          <button id="manage-delete" class="danger" type="button">删除节点</button>
        </div>
        <label class="manage-check"><input id="manage-clear-history" type="checkbox"> 删除时同时清除该节点历史流量</label>
        <p id="manage-result"></p>
      </div>
    </section>
  </div>
</main>

<nav class="bottom-nav" aria-label="面板导航">
  <button class="nav-btn on" data-view="home" type="button"><span class="nav-icon">⌂</span><span>首页</span></button>
  <button class="nav-btn" data-view="daily" type="button"><span class="nav-icon">▦</span><span>每日</span></button>
  <button class="nav-btn" data-view="node" type="button"><span class="nav-icon">◎</span><span>节点</span></button>
  <button class="nav-btn" data-view="manage" type="button"><span class="nav-icon">⚙</span><span>管理</span></button>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="tip" class="tip"></div>
<script src="app.js"></script>
</body>
</html>
