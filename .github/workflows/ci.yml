name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4（pin 完整 commit SHA，防供应链替换）
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # actions/setup-go@v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.27.1"

      - name: gofmt check
        run: |
          out="$(gofmt -l .)"
          if [[ -n "$out" ]]; then
            echo "::error::gofmt 未通过: $out"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go test (race)
        run: go test -race ./...

      - name: shellcheck（安装器/脚本静态检查）
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq shellcheck >/dev/null
          # 生产代码：error+warning 全查不豁免；info/style(SC2015 `A && B || C` 等
          # intentional shell 惯用法)用 -S warning 排除，不 fail
          shellcheck -S warning installer-template.sh sbx.sh
          # 测试/真机验收脚本：仅豁免 SC2034——这些脚本大量使用
          # `read RX TX <<< ...`（RX 仅作配对字段）与 source 跨文件追踪，
          # 属 shellcheck 已知局限；其余 error+warning 仍全部检查。
          # SC2319（`[[ ... ]]; ck "msg" $?`：$? 指向前一个条件）在本仓库
          # 是刻意的惯用法，属 shellcheck 误报；且它在 shellcheck 0.10+ 才按
          # warning 级报出——不豁免的话，runner 一旦升级到 0.10+，test job 立刻
          # 变红，而 publish-dist 依赖 test → 会连带阻断全部架构的产物发布，
          # 安装器随即因"candidate 版本必须与 APP_VERSION 严格一致"而拒绝安装。
          shellcheck -S warning -e SC2034 -e SC2319 scripts/*.sh tests/*.sh

      - name: sbx.sh 与模板同步检查（防 drift）
        run: |
          # build.py 已移除（Go 化后无 Python），等价动作：模板拷贝为发布脚本
          cp installer-template.sh sbx.sh && chmod 755 sbx.sh
          git diff --exit-code -- sbx.sh installer-template.sh || {
            echo "::error::sbx.sh 与 installer-template.sh 不同步，请运行 cp installer-template.sh sbx.sh";
            git diff -- sbx.sh | head -40;
            exit 1;
          }

      - name: 安装器 checksum 流程测试（提取模板真实逻辑）
        run: bash tests/checksum_flow_test.sh

      - name: 安装器 commit/rollback 流程测试（提取模板真实逻辑）
        run: bash tests/commit_flow_test.sh

      - name: 安装器 fw_apply / ensure_panel_conf 流程测试（提取模板真实逻辑）
        run: bash tests/installer_flow_test.sh

      - name: 安装器分发链 / 权限流程测试（提取模板真实逻辑）
        run: bash tests/dist_flow_test.sh

      - name: v3.0.5 基线收口测试（版本一致性 / 无 Tag / checksum fail-closed / 权限）
        run: bash tests/baseline_test.sh

      - name: 安装器加固测试（环境变量白名单 / 脚本完整性自校验）
        run: bash tests/hardening_flow_test.sh

  # Alpine / musl 兼容性矩阵（审计项「测试覆盖」要求 CI 矩阵）。
  #
  # README 明确宣称支持 Alpine 3.18+ 且二进制用 musl 构建，但既有 CI 只在
  # ubuntu（glibc）上跑——"宣称支持 musl" 与 "在 musl 上验证过" 是两件事。
  # 这个 job 在 Alpine 容器里跑完整单元测试，覆盖：
  #   · 纯 Go 依赖在 musl 下可构建（modernc.org/sqlite 是纯 Go，不需要 cgo）
  #   · /proc 解析、fsx 的目录 fsync、时间/时区等与 libc 相关的路径
  # 不跑 -race：race 检测器需要 cgo + gcc，与"无 cgo 静态二进制"的分发形态
  # 不同；race 覆盖由 ubuntu 上的 test job 负责。
  test-alpine:
    runs-on: ubuntu-latest
    container: golang:1.27-alpine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: gofmt / vet / test（musl）
        run: |
          gofmt -l .
          go vet ./...
          go test -count=1 ./...

      - name: 静态构建冒烟（CGO_ENABLED=0，与分发产物形态一致）
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o /tmp/sbx-core ./cmd/sbx-core
          /tmp/sbx-core version
          file /tmp/sbx-core | grep -q 'statically linked' \
            || echo "::warning::产物未标记为静态链接（musl 下通常静态，此处仅提示）"

  # 供应链漏洞扫描（审计项「依赖供应链」）。
  #
  # 刻意做成**独立 job 且不被 publish-dist 依赖**：govulncheck 的漏洞库在线更新，
  # 一旦 Go 标准库出现新 CVE 这里会变红——但那时正确的动作是尽快升级并发布修复，
  # 而不是把发布链本身卡住（锁死 dist 只会让用户停留在有漏洞的旧二进制上）。
  # 因此它只提供可见信号，不阻断产物发布。
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.27.1"

      - name: govulncheck
        run: |
          # 固定版本，避免 @latest 引入未经评审的工具链变更
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  # 二进制分发：main 全部测试通过后，把全架构产物发布到 dist 分支（rolling latest）。
  # dist 是普通分支，不是 Tag——安装器固定从 raw .../dist/<artifact> 下载。
  # 仅当本次提交实际影响产物/安装器时才重建发布（纯 README/docs 跳过）。
  publish-dist:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # actions/setup-go@v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.27.1"

      - name: 判断是否影响产物/安装器（纯 docs 跳过）
        id: changed
        run: |
          if git diff --quiet HEAD~1 HEAD -- cmd internal go.mod go.sum \
              scripts installer-template.sh internal/version; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "无产物相关变更，跳过发布"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建全架构二进制
        if: steps.changed.outputs.skip != 'true'
        run: ./scripts/build-release.sh dist

      - name: SHA256SUMS 自检 + 版本三方一致性（APP_VERSION/Go/二进制，无 Tag）
        if: steps.changed.outputs.skip != 'true'
        run: bash scripts/artifact_check.sh dist

      - name: 分发清单一致性（产物与 scripts/dist-manifest.txt 完全一致）
        if: steps.changed.outputs.skip != 'true'
        run: |
          ls dist | sort > /tmp/actual.txt
          sort scripts/dist-manifest.txt > /tmp/expected.txt
          diff /tmp/expected.txt /tmp/actual.txt || {
            echo "::error::dist 产物与清单不一致"; exit 1;
          }

      - name: 发布到 dist 分支（force-push，仅产物文件）
        if: steps.changed.outputs.skip != 'true'
        run: |
          git config user.name "sbx-dist-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch origin dist || true   # 首次运行时 dist 分支尚不存在，属正常
          git checkout --orphan dist-new
          # 只清空索引、不动工作区（不能用 git rm -rf .，那会把刚构建的产物删掉）。
          #
          # 必须用 read-tree --empty：`git rm -r --cached .` 在「工作区文件与
          # HEAD 内容都不同」时会报错退出（build-release.sh 重建过 dist/ 就是
          # 这种情况），旧写法 `|| true` 吞掉了失败，导致整个源码树留在索引里，
          # dist 分支被推成 120 个文件 / 142MB，还夹带一份过期二进制副本。
          git read-tree --empty
          # 断言索引确实为空，避免以后再静默回归
          if [[ -n "$(git ls-files)" ]]; then
            echo "::error::索引未清空，拒绝发布 dist"; git ls-files | head -20; exit 1
          fi
          # 产物必须位于分支根（安装器请求 raw .../dist/<file>，不带子目录）
          VER="$(grep -m1 '^const Version' internal/version/version.go | sed 's/.*"\(.*\)".*/\1/')"
          cp dist/sbx-core-linux-* dist/SHA256SUMS .
          # 安装器本体与它的 sha256 一并发布：README 的"安全安装方式"让用户
          # 先下载 sbx.sh.sha256 校验再执行；也支持
          # `SBX_SCRIPT_SHA256=<值> bash <(curl ...)` 由脚本自校验。
          # 与二进制放在同一分支同一提交，保证"脚本 ↔ 二进制"版本严格对应。
          cp sbx.sh .
          sha256_of() { sha256sum "$1" | awk '{print $1}'; }
          printf '%s  sbx.sh\n' "$(sha256_of sbx.sh)" > sbx.sh.sha256
          git add -f sbx-core-linux-* SHA256SUMS sbx.sh sbx.sh.sha256
          git add scripts/dist-manifest.txt
          # 发布前断言：dist 分支只能含产物 + 清单，不得夹带源码或子目录副本
          tracked="$(git ls-files | sort)"
          # 顶层只允许：产物 + SHA256SUMS + 安装器 + 清单；archive/ 下的历史
          # 归档单独校验（只允许 SHA256SUMS / sbx.sh / sbx.sh.sha256 / MANIFEST）
          expected="$(printf '%s\n' SHA256SUMS sbx.sh sbx.sh.sha256 \
            scripts/dist-manifest.txt $(cd dist && ls sbx-core-linux-*) | sort)"
          tracked="$(git ls-files | grep -v '^archive/' | sort)"
          bad_arch="$(git ls-files 'archive/*' | grep -vE '^archive/[^/]+/[0-9a-f]{7}/(SHA256SUMS|sbx\.sh|sbx\.sh\.sha256|MANIFEST)$' || true)"
          if [[ -n "$bad_arch" ]]; then
            echo "::error::archive/ 下存在不允许的文件"; echo "$bad_arch" | head; exit 1
          fi
          if [[ "$tracked" != "$expected" ]]; then
            echo "::error::dist 分支内容不符合预期"
            diff <(echo "$expected") <(echo "$tracked") || true
            exit 1
          fi
          # ---- 历史归档（审计项「滚动发布风险」）----
          # 旧实现每次 force-push 一个**无历史的 orphan 提交**，旧产物直接消失，
          # 用户无法回退到已知可用的版本。这里把每次发布的"小型可追溯件"
          # （SHA256SUMS + 安装器 + 清单）按 版本/commit 归档。
          #
          # 刻意**不归档二进制**：8 架构合计约 80MB/次，归档几次就会把分支撑爆；
          # 二进制可由 commit 完全复现（见 README「版本化下载与回退」），
          # 而校验和 + 安装器足以让用户确认"当时发布的是什么"。
          git fetch -q origin dist 2>/dev/null || true
          if git rev-parse --verify -q FETCH_HEAD >/dev/null; then
            # checkout <commit> -- <path> 会同时写入索引与工作区，无需再 reset
            git checkout -q FETCH_HEAD -- archive 2>/dev/null || true
          fi
          ARCH="archive/v${VER}/${GITHUB_SHA::7}"
          mkdir -p "$ARCH"
          cp SHA256SUMS sbx.sh sbx.sh.sha256 "$ARCH/"
          {
            echo "version: v${VER}"
            echo "commit: ${GITHUB_SHA}"
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "artifacts:"
            awk '{printf "  - %s  %s\n", $2, $1}' SHA256SUMS
          } > "$ARCH/MANIFEST"
          git add -f archive
          # 只保留最近 20 个归档，防止分支体积无界增长
          keep=$(git ls-files 'archive/*/MANIFEST' | sed -E 's#^archive/([^/]+)/.*#\1#' | sort -u | tail -20)
          for v in $(git ls-files 'archive/*/MANIFEST' | sed -E 's#^archive/([^/]+)/.*#\1#' | sort -u); do
            if ! printf '%s\n' "$keep" | grep -qx "$v"; then
              git rm -r -q --cached "archive/$v" 2>/dev/null || true
            fi
          done
          echo "归档: $ARCH（保留最近 $(printf '%s\n' "$keep" | grep -c . ) 个版本）"

          git commit -qm "dist: rebuild from ${GITHUB_SHA::7} (v$VER)"
          git push -f origin dist-new:dist

      - name: 为当前版本打 Tag（已存在则跳过，重大版本可追溯）
        if: steps.changed.outputs.skip != 'true'
        run: |
          VER="$(grep -m1 '^const Version' internal/version/version.go | sed 's/.*"\(.*\)".*/\1/')"
          TAG="v$VER"
          # 项目此前刻意不用 Tag（dist 是 rolling latest）。这里只补"可追溯锚点"：
          # 同一版本重复发布不覆盖既有 Tag（避免指针漂移），Tag 指向当时的 main。
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG 已存在，跳过"
          else
            git tag -a "$TAG" -m "SBX $TAG (build ${GITHUB_SHA::7})" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
            echo "已创建 Tag $TAG"
          fi

      - name: 验证 raw 分发地址真实可用（amd64 + SHA256SUMS）
        if: steps.changed.outputs.skip != 'true'
        run: |
          sleep 10
          for f in sbx-core-linux-amd64 sbx-core-linux-arm64 SHA256SUMS sbx.sh sbx.sh.sha256; do
            code=$(curl -sIL -o /dev/null -w '%{http_code}' \
              "https://raw.githubusercontent.com/${{ github.repository }}/dist/$f")
            [[ "$code" == "200" ]] || { echo "::error::分发地址不可用: $f -> HTTP $code"; exit 1; }
            echo "  [OK] $f -> 200"
          done
