name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: gofmt check
        run: |
          out="$(gofmt -l .)"
          if [[ -n "$out" ]]; then
            echo "::error::gofmt 未通过: $out"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        run: go test -race ./...

      - name: sbx.sh 与模板同步检查（防 drift）
        run: |
          python3 build.py >/dev/null
          git diff --exit-code -- sbx.sh installer-template.sh || {
            echo "::error::sbx.sh 与 installer-template.sh 不同步，请运行 python3 build.py";
            git diff -- sbx.sh | head -40;
            exit 1;
          }

      - name: 安装器 checksum 流程测试（提取模板真实逻辑）
        run: bash tests/checksum_flow_test.sh

      - name: 安装器 commit/rollback 流程测试（提取模板真实逻辑）
        run: bash tests/commit_flow_test.sh

      - name: 安装器 fw_apply / ensure_panel_conf 流程测试（提取模板真实逻辑）
        run: bash tests/installer_flow_test.sh

      - name: Python reference suite（旧实现回归，src/ 仅作参考保留）
        run: python3 tests/run_all.py

      - name: 金标夹具再生校验（Go 行为 vs Python reference 漂移检测）
        run: |
          python3 tests/gen_goldens.py
          git diff --exit-code -- internal/*/testdata || {
            echo "::error::金标夹具漂移：Go 实现与 Python reference 输出不一致";
            git diff --stat -- internal/*/testdata;
            exit 1;
          }
