name: Release

# 本项目不依赖 Git Tag 管理：本工作流仅手动触发，
# 用于构建全架构二进制并完成一致性校验（不创建 Release、不创建 Tag）。
# 发布资产如需更新，由维护者手动上传到既有 Release（或另行明确操作）。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: 测试门禁
        run: |
          go vet ./...
          go test -race ./...

      - name: sbx.sh 与模板同步检查（防 drift）
        run: |
          python3 build.py >/dev/null
          git diff --exit-code -- sbx.sh installer-template.sh || {
            echo "::error::发布脚本与模板不同步"; exit 1;
          }

      - name: 构建全架构二进制
        run: ./scripts/build-release.sh dist

      - name: SHA256SUMS 自检
        run: cd dist && sha256sum -c SHA256SUMS

      # 无 Tag 时代的一致性检查：APP_VERSION == Go Version == 产物 version 输出
      # （artifact_check.sh 在未提供期望版本号时不做任何 Tag 相关断言）
      - name: 发布物一致性检查（APP_VERSION / Go Version / 二进制输出）
        run: bash scripts/artifact_check.sh dist

      - name: 上传构建产物（仅 workflow 附件，不创建 Release/Tag）
        uses: actions/upload-artifact@v4
        with:
          name: sbx-core-binaries
          path: |
            dist/sbx-core-linux-amd64
            dist/sbx-core-linux-arm64
            dist/sbx-core-linux-armv7
            dist/sbx-core-linux-armv6
            dist/sbx-core-linux-386
            dist/sbx-core-linux-s390x
            dist/sbx-core-linux-riscv64
            dist/SHA256SUMS
