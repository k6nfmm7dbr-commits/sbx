name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: 测试门禁
        run: |
          go vet ./...
          go test -race ./...

      - name: sbx.sh 与模板同步检查（防 drift）
        run: |
          python3 build.py >/dev/null
          git diff --exit-code -- sbx.sh installer-template.sh || {
            echo "::error::发布脚本与模板不同步"; exit 1;
          }

      - name: 构建全架构二进制
        run: ./scripts/build-release.sh dist

      - name: SHA256SUMS 自检
        run: cd dist && sha256sum -c SHA256SUMS

      - name: 发布物一致性与版本三方一致性检查
        env:
          EXPECT_TAG: ${{ github.ref_name }}
        run: bash scripts/artifact_check.sh dist "$EXPECT_TAG"

      # 以上全部通过后才允许上传发布资产（先验证后上传）
      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sbx-core-linux-amd64
            dist/sbx-core-linux-arm64
            dist/sbx-core-linux-armv7
            dist/sbx-core-linux-armv6
            dist/sbx-core-linux-386
            dist/sbx-core-linux-s390x
            dist/sbx-core-linux-riscv64
            dist/SHA256SUMS
          generate_release_notes: true
