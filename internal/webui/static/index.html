<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>SBX · 流量面板</title>
<link rel="stylesheet" href="style.css">
</head>
<body>


<main class="wrap">

  <!-- ===== 实时概览 ===== -->
  <section class="view on" id="view-home">

    <div class="hero glass">
      <div class="hero-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        <span>实时速率</span>
      </div>
      <div id="hero-rate" class="hero-rate">—</div>
      <div class="hero-pair">
        <div class="pair up">
          <i aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </i>
          <div><small>上传</small><b id="hero-up">—</b></div>
        </div>
        <div class="pair down">
          <i aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
          </i>
          <div><small>下载</small><b id="hero-down">—</b></div>
        </div>
      </div>
    </div>

    <div class="stats">
      <div class="stat glass">
        <div class="stat-head">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          <span>今日流量</span>
        </div>
        <b id="kpi-today-total">—</b>
      </div>
      <div class="stat glass">
        <div class="stat-head">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          <span>累计流量</span>
        </div>
        <b id="kpi-all-total">—</b>
      </div>
      <div class="stat glass">
        <div class="stat-head">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          <span>TCP 连接</span>
        </div>
        <b id="kpi-conns">—</b>
      </div>
      <div class="stat glass">
        <div class="stat-head">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18z"/></svg>
          <span>UDP 会话</span>
        </div>
        <b id="kpi-conns-udp">—</b>
      </div>
      <div class="stat glass wide">
        <div class="stat-head">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          <span>在线节点</span>
        </div>
        <b id="kpi-nodes">—</b>
      </div>
    </div>

    <div class="panel glass">
      <div class="panel-head">
        <h2>节点</h2>
        <span class="hint">点卡片底部可看在线 IP · 点「管理」设额度</span>
      </div>
      <div id="node-cards" class="node-list"></div>
    </div>

  </section>

  <!-- ===== 每日趋势 ===== -->
  <section class="view" id="view-daily">
    <div class="panel glass">
      <div class="panel-head"><h2>每日流量趋势</h2><span class="hint">最近 180 天</span></div>
      <div id="daily-table"></div>
    </div>
  </section>

  <!-- ===== 单节点趋势 ===== -->
  <section class="view" id="view-node">
    <div class="panel glass">
      <div class="panel-head">
        <h2>节点详情</h2>
        <select id="node-select" aria-label="选择节点"></select>
      </div>
      <!-- 日期用日历选：节点有 180 天记录，平铺成表格既长又看不出哪天有流量 -->
      <div id="node-cal" class="cal"></div>
      <div id="node-day-summary" class="day-summary"></div>
    </div>
    <div class="panel glass">
      <div class="panel-head">
        <h2 id="node-domains-title">访问域名</h2>
        <small id="node-domains-meta">—</small>
      </div>
      <div id="node-domains-table"></div>
    </div>
  </section>

  <!-- ===== 节点配置（新增 / 查看分享 / 修改 / 删除） ===== -->
  <section class="view" id="view-manage">
    <div class="panel glass manage-panel">
      <div class="panel-head manage-head">
        <h2>节点配置</h2>
        <div class="manage-actions">
          <button class="btn primary" id="node-create-open" type="button">添加节点</button>
          <button class="btn ghost" id="node-batch-open" type="button">批量添加</button>
          <button class="btn ghost" id="node-batch-manage" type="button">批量管理</button>
          <button class="btn ghost danger hidden" id="node-batch-delete" type="button">删除所选</button>
        </div>
      </div>
      <div id="node-manage-list" class="manage-list"></div>
    </div>
  </section>

</main>

<nav class="dock glass">
  <button class="tab on" data-view="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg>
    <span>总览</span>
  </button>
  <button class="tab" data-view="daily">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    <span>趋势</span>
  </button>
  <button class="tab" data-view="node">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="3"/><circle cx="5" cy="19" r="3"/><circle cx="19" cy="19" r="3"/><path d="M12 8v4m0 0-5.5 5.5M12 12l5.5 5.5"/></svg>
    <span>节点</span>
  </button>
  <button class="tab" data-view="manage">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 8h8M8 12h5M8 16h3"/></svg>
    <span>配置</span>
  </button>
  <button class="tab logout-tab" id="logout-button" type="button" aria-label="登出">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/></svg>
    <span>登出</span>
  </button>
</nav>

<!-- ===== 策略抽屉 ===== -->
<div class="drawer-mask" id="drawer-mask"></div>
<aside class="drawer" id="policy-drawer" role="dialog" aria-modal="true">
  <header class="drawer-head">
    <div>
      <small>节点管理</small>
      <h3 id="drawer-node-name">—</h3>
    </div>
    <button class="icon-btn" id="drawer-close" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </header>

  <div class="drawer-body">
    <section class="sect">
      <label class="switch-row">
        <div><b>节点启用</b><small>关闭后通过防火墙暂停该节点，恢复时保留原配置</small></div>
        <input type="checkbox" id="pol-node-enabled" class="sw-input"><span class="sw" aria-hidden="true"></span>
      </label>
    </section>

    <section class="sect">
      <label class="switch-row">
        <div><b>IP 数量限制</b><small>达上限后阻止新 IP 接入</small></div>
        <input type="checkbox" id="pol-ip-enable" class="sw-input"><span class="sw" aria-hidden="true"></span>
      </label>
      <div class="field summary-field">
        <small>当前在线 IP</small>
        <output id="pol-ip-active">—</output>
      </div>
      <div id="pol-ip-box" class="box hidden">
        <div class="field row">
          <input type="number" id="pol-ip-max" min="1" step="1" inputmode="numeric" placeholder="最大同时在线数">
        </div>
      </div>
    </section>

    <section class="sect">
      <label class="switch-row">
        <div><b>限速</b><small>上传 / 下载各自限到该带宽</small></div>
        <input type="checkbox" id="pol-rate-enable" class="sw-input"><span class="sw" aria-hidden="true"></span>
      </label>
      <div id="pol-rate-box" class="box hidden">
        <div class="field row">
          <input type="number" id="pol-rate-mbps" min="1" step="1" inputmode="numeric" placeholder="带宽">
          <select id="pol-rate-unit" class="unit" disabled aria-label="单位"><option value="Mbps" selected>Mbps</option></select>
        </div>
      </div>
    </section>

    <div class="err" id="pol-error"></div>
  </div>

  <footer class="drawer-foot">
    <button class="btn ghost" id="pol-cancel">取消</button>
    <button class="btn primary" id="pol-save">保存</button>
  </footer>
</aside>

<!-- ===== 在线 IP 抽屉 ===== -->
<aside class="drawer" id="ips-drawer" role="dialog" aria-modal="true">
  <header class="drawer-head">
    <div>
      <small>在线 IP</small>
      <h3 id="ips-node-name">—</h3>
    </div>
    <button class="icon-btn" id="ips-close" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </header>
  <div class="drawer-body"><div id="ips-list" class="ips-list"></div></div>
</aside>

<!-- ===== 节点配置编辑抽屉 ===== -->
<aside class="drawer" id="node-editor-drawer" role="dialog" aria-modal="true">
  <header class="drawer-head">
    <div><small id="node-editor-kicker">节点配置</small><h3 id="node-editor-title">添加节点</h3></div>
    <button class="icon-btn" id="node-editor-close" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </header>
  <div class="drawer-body">
    <section class="sect" id="node-editor-type-section">
      <label class="field"><small>协议</small><select id="node-form-type"><option value="vless">VLESS + Reality</option><option value="shadowsocks">Shadowsocks 2022</option><option value="trojan">Trojan</option><option value="anytls">AnyTLS</option><option value="snell">Snell</option><option value="socks">SOCKS5</option></select></label>
    </section>
    <section class="sect">
      <label class="field"><small>节点名称</small><input id="node-form-name" type="text" maxlength="80" placeholder="例如 香港-01"></label>
      <label class="field"><small>端口</small><input id="node-form-port" type="number" min="1" max="65535" inputmode="numeric" value="443" placeholder="443"></label>
      <label class="field node-form-sni"><small>伪装域名（SNI）</small><input id="node-form-sni" type="text" placeholder="www.example.com"></label>
      <label class="field node-form-ss hidden"><small>加密算法</small><select id="node-form-method"><option value="2022-blake3-aes-128-gcm">2022-blake3-aes-128-gcm</option><option value="2022-blake3-aes-256-gcm">2022-blake3-aes-256-gcm</option></select></label>
      <label class="field node-form-snell hidden"><small>Snell 版本</small><select id="node-form-version"><option value="5">Snell v5</option><option value="6">Snell v6</option></select></label>
      <label class="field node-form-psk hidden"><small>新 PSK（留空则不变）</small><input id="node-form-psk" type="password" autocomplete="new-password" placeholder="留空保持当前 PSK"></label>
      <small class="node-secret-note" id="node-secret-note">节点密钥和密码由服务器安全生成，面板不会显示或传输这些密钥。</small>
    </section>
    <section class="sect" id="node-editor-allow-section">
      <label class="field check"><input type="checkbox" id="node-form-allow-on"><span>只允许访问特定服务</span></label>
      <div id="node-form-allow-body" class="hidden">
        <small class="node-secret-note">开启后，这个节点只能访问下面勾选的服务，其它网站一律无法访问。限制只作用于该节点，其它节点不受影响。</small>
        <div class="allow-toolbar">
          <input type="search" id="node-form-allow-search" class="allow-search" placeholder="搜索服务名，如 Netflix、Telegram" autocomplete="off" aria-label="搜索可选服务">
          <button type="button" class="btn allow-toggle" id="node-form-allow-toggle">展开全部</button>
        </div>
        <div id="node-form-allow-list" class="ruleset-picker"></div>
        <small class="node-secret-note" id="node-form-allow-count"></small>
      </div>
    </section>
    <div class="err hidden" id="node-form-error"></div>
  </div>
  <footer class="drawer-foot"><button class="btn ghost" id="node-form-cancel">取消</button><button class="btn primary" id="node-form-save">保存</button></footer>
</aside>

<!-- ===== 节点分享链接抽屉 ===== -->
<aside class="drawer" id="node-batch-drawer" role="dialog" aria-modal="true">
  <header class="drawer-head"><div><small>节点配置</small><h3>批量添加节点</h3></div><button class="icon-btn" id="node-batch-close" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></header>
  <div class="drawer-body">
    <section class="sect">
      <label class="field">协议类型
        <select id="node-batch-type">
          <option value="shadowsocks">Shadowsocks 2022</option>
          <option value="trojan">Trojan</option>
          <option value="vless">VLESS (Reality)</option>
          <option value="anytls">AnyTLS</option>
          <option value="snell">Snell</option><option value="socks">SOCKS5</option>
        </select>
        <small class="node-secret-note">所有节点使用同一协议，密钥逐个独立生成。</small>
      </label>
      <label class="field node-batch-ss hidden">加密算法
        <select id="node-batch-method">
          <option value="2022-blake3-aes-128-gcm">2022-blake3-aes-128-gcm（默认）</option>
          <option value="2022-blake3-aes-256-gcm">2022-blake3-aes-256-gcm</option>
        </select>
        <small class="node-secret-note">每个节点的密码按该算法独立生成；建好后不支持换算法。</small>
      </label>
      <label class="field node-batch-snell hidden">Snell 版本
        <select id="node-batch-version">
          <option value="5">Snell v5</option>
          <option value="6">Snell v6</option>
        </select>
        <small class="node-secret-note">v6 的 PSK 要求 12–255 字节，自动生成时已满足。</small>
      </label>
      <label class="field">名称前缀
        <input type="text" id="node-batch-prefix" maxlength="40" placeholder="例如：员工" autocomplete="off">
        <small class="node-secret-note">节点将命名为「前缀-1」「前缀-2」……留空则用协议名。</small>
      </label>
      <label class="field">数量
        <input type="number" id="node-batch-count" min="1" max="50" value="3" inputmode="numeric">
      </label>
      <label class="field">起始端口
        <input type="number" id="node-batch-port" min="1024" max="65535" placeholder="留空自动分配" inputmode="numeric">
        <small class="node-secret-note">留空时自动挑选连续的空闲端口；指定则使用「起始端口、起始端口+1、…」。</small>
      </label>
    </section>
  </div>
  <footer class="drawer-foot"><button class="btn primary" id="node-batch-save">创建</button><button class="btn ghost" id="node-batch-cancel">取消</button></footer>
</aside>
<aside class="drawer" id="node-links-drawer" role="dialog" aria-modal="true">
  <header class="drawer-head"><div><small>节点分享</small><h3 id="node-links-title">—</h3></div><button class="icon-btn" id="node-links-close" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></header>
  <div class="drawer-body"><div id="node-links-list" class="node-links-list"></div></div>
  <footer class="drawer-foot"><button class="btn ghost" id="node-links-done">关闭</button></footer>
</aside>

<!-- 删除确认：必须手动输入「我已确定」才放行（WebView 会屏蔽 window.confirm/prompt，
     所以这里用页面内的对话框；单节点删除与批量删除共用一套）。 -->
<div class="typed-confirm-mask" id="typed-confirm-mask">
  <div class="typed-confirm" id="typed-confirm" role="dialog" aria-modal="true" aria-labelledby="typed-confirm-title">
    <h3 id="typed-confirm-title">确认删除</h3>
    <div class="typed-confirm-body" id="typed-confirm-body"></div>
    <label class="typed-confirm-hint" id="typed-confirm-hint" for="typed-confirm-input">请输入「我已确定」以继续：</label>
    <input id="typed-confirm-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
    <div class="typed-confirm-actions">
      <button type="button" class="btn danger" id="typed-confirm-ok" disabled>确定</button>
      <button type="button" class="btn ghost" id="typed-confirm-cancel">取消</button>
    </div>
  </div>
</div>

<div id="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
