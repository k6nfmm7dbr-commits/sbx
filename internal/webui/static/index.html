<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SBX 流量面板</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-mark">SBX</div>
    <div class="brand-text">
      <h1>流量面板</h1>
      <p id="status-txt" class="status-txt">连接中…</p>
    </div>
  </div>
  <span id="pulse" class="pulse"></span>
</header>

<main class="main">
  <!-- 首页 -->
  <div id="view-home" class="view on">
    <section class="hero">
      <div class="hero-head">
        <span class="hero-label">实时速率</span>
        <span class="hero-sub">字节 / 秒</span>
      </div>
      <div id="hero-rate" class="hero-value">—</div>
      <div class="hero-pair">
        <div class="hero-item">
          <span class="tag up">↑ 上传</span>
          <b id="hero-up" class="up">—</b>
        </div>
        <div class="hero-item">
          <span class="tag down">↓ 下载</span>
          <b id="hero-down" class="down">—</b>
        </div>
      </div>
    </section>

    <section class="stats">
      <div class="stat">
        <label>今日流量</label>
        <strong id="kpi-today-total">—</strong>
      </div>
      <div class="stat">
        <label>累计流量</label>
        <strong id="kpi-all-total">—</strong>
      </div>
      <div class="stat">
        <label>TCP 连接</label>
        <strong id="kpi-conns">—</strong>
      </div>
      <div class="stat">
        <label>UDP 会话</label>
        <strong id="kpi-conns-udp">—</strong>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>节点状态</h2>
        <span class="count">共 <b id="kpi-nodes">0</b> 个</span>
      </div>
      <div id="node-cards" class="node-list"></div>
    </section>
  </div>

  <!-- 每日 -->
  <div id="view-daily" class="view">
    <section class="panel">
      <div class="panel-head"><h2>每日流量</h2><span class="panel-sub">最近 60 天</span></div>
      <div id="daily-table"></div>
    </section>
  </div>

  <!-- 节点 -->
  <div id="view-node" class="view">
    <section class="panel">
      <div class="panel-head">
        <h2>节点明细</h2>
        <select id="node-select" aria-label="选择节点"></select>
      </div>
      <div id="node-daily-table"></div>
    </section>
  </div>
</main>

<nav class="tabbar">
  <button class="tab on" data-view="home"><span class="ico">⌂</span>首页</button>
  <button class="tab" data-view="daily"><span class="ico">▤</span>每日</button>
  <button class="tab" data-view="node"><span class="ico">◎</span>节点</button>
</nav>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
