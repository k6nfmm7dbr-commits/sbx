<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>登录 · SBX 流量面板</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
<div class="login">
  <div class="brand-mark">SBX</div>
  <h1>流量面板</h1>
  <p>请输入访问令牌（可用 <code>sbx</code> 菜单查看）</p>
  <div class="err" id="err"></div>
  <form method="post" action="/login">
    <input type="password" name="token" placeholder="访问令牌" autocomplete="current-password"
           autofocus required aria-label="访问令牌">
    <button type="submit">进入面板</button>
  </form>
</div>
<script src="login.js"></script>
</body>
</html>
