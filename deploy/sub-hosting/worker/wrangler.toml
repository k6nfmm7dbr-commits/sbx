# 部署：wrangler deploy
# 密钥不要写在这里：wrangler secret put SUB_TOKEN / GH_TOKEN

name = "sbx-sub"
main = "sub-worker.js"
compatibility_date = "2024-11-01"

# 绑了自定义域名之后可以改成 false，少一个被扫描的入口
workers_dev = true

[vars]
REPO = "your-name/sbx-sub"
BRANCH = "main"
PATH_SUB = "sub.txt"
PATH_SINGBOX = "sub-singbox.json"

# 刻意不开 [observability]：Workers Logs 会记录请求 URL，
# 而订阅令牌就在路径里，等于把密码写进日志。
# 排障时临时开、排完立刻关。
